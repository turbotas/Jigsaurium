name: jigsaurium

services:
  web:
    image: ghcr.io/turbotas/jigsaurium:prod
    container_name: jigsaurium-web
    restart: unless-stopped
    env_file:
      - path: /mnt/<pool>/apps/jigsaurium-config/prod.env
        required: true
    ports:
      - "${JIGSAURIUM_PORT:-5000}:5000"
    volumes:
      # Absolute dataset path: a relative path resolves inside /mnt/.ix-apps, which TrueNAS owns.
      - "/mnt/<pool>/apps/jigsaurium-prod-instance:/app/instance"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s # model warm-up and migrations can take minutes on the NAS
