name: jigsaurium

services:
  web:
    image: ghcr.io/YOUR_ORG/jigsaurium:prod
    container_name: jigsaurium-web
    restart: unless-stopped
    env_file:
      - path: /mnt/NAS1Pool1/documents/Projects/GitProjects/Jigsaurium/environments/prod.env.local
        required: true
    ports:
      - "${JIGSAURIUM_PORT:-5000}:5000"
    volumes:
      - "${JIGSAURIUM_INSTANCE_PATH:-./instance}:/app/instance"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
