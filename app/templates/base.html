<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jigsaurium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/govuk/govuk-frontend.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="govuk-template__body">
    <script>
      document.body.className += " js-enabled";
    </script>
    <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>
    <header class="govuk-header" data-module="govuk-header">
      <div class="govuk-header__container govuk-width-container">
        <div class="govuk-header__content">
          <a href="/" class="govuk-header__link govuk-header__link--service-name">Jigsaurium</a>
        </div>
      </div>
    </header>
    <main class="govuk-main-wrapper" id="main-content">
      <div class="govuk-width-container app-main-container">
        {% block content %}{% endblock %}
      </div>
    </main>
    <script src="{{ url_for('static', filename='vendor/govuk/govuk-frontend.min.js') }}"></script>
    <script>
      if (window.GOVUKFrontend) {
        window.GOVUKFrontend.initAll();
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
