name: CI

# PRs run once (pull_request); pushes run only on the default branch, so a PR branch is not
# tested twice. A newer push to the same PR/branch cancels the older run.
# Thursdays the default branch also runs on a schedule. When that passes, Build and Promote builds
# a fresh image anyway (new patch version), so OS package and base-image fixes reach test every
# week even when nothing in the repository changed.
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 5 * * 4" # Thursdays 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    name: API and Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load app settings
        run: grep -hEv '^[[:space:]]*(#|$)' .github/app-ci/settings.env .github/app-ci/test.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.CI_TEST_LOCK }}

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r "$CI_TEST_REQUIREMENTS" -c "$CI_TEST_LOCK"

      - name: Guard against GPU dependency installs
        run: |
          python -c "import subprocess, sys; lines = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines(); names = [line.split('==', 1)[0].strip().lower() for line in lines if '==' in line]; blocked = sorted({name for name in names if name.startswith('nvidia-') or name.startswith('cuda-')});
          if blocked:
              print('Blocked GPU package(s) detected in pip environment:');
              [print(f'- {name}') for name in blocked];
              raise SystemExit(1)
          print('GPU dependency guard passed: no nvidia-* or cuda-* pip packages found.')"

      - name: Run non-UI pytest suite
        run: python -m pytest -m "not ui"

  ui-smoke:
    name: UI Smoke Tests
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load app settings
        run: grep -hEv '^[[:space:]]*(#|$)' .github/app-ci/settings.env .github/app-ci/test.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.CI_TEST_LOCK }}

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r "$CI_TEST_REQUIREMENTS" -c "$CI_TEST_LOCK"

      - name: Guard against GPU dependency installs
        run: |
          python -c "import subprocess, sys; lines = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines(); names = [line.split('==', 1)[0].strip().lower() for line in lines if '==' in line]; blocked = sorted({name for name in names if name.startswith('nvidia-') or name.startswith('cuda-')});
          if blocked:
              print('Blocked GPU package(s) detected in pip environment:');
              [print(f'- {name}') for name in blocked];
              raise SystemExit(1)
          print('GPU dependency guard passed: no nvidia-* or cuda-* pip packages found.')"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI pytest suite
        run: python -m pytest -m ui

  image-smoke:
    name: Image Build, Smoke Test and Scan
    runs-on: ubuntu-latest

    # Throwaway database so the container can run its migrations and start for real. MariaDB runs
    # with its own defaults on purpose, so a brand-new database must build cleanly without flags.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: app
          MARIADB_USER: app
          MARIADB_PASSWORD: ci-smoke-password
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load app settings
        run: grep -hEv '^[[:space:]]*(#|$)' .github/app-ci/settings.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Week number for the weekly OS package refresh
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OS_REFRESH=${{ steps.week.outputs.value }}
            APP_VERSION=ci
            APP_BUILD_SHA=${{ github.sha }}

      # APP_ENV and SECRET_KEY are common to every app; the rest comes from .github/app-ci/smoke.env.
      - name: Start container
        run: |
          docker run -d --name app-ci --network host \
            -e APP_ENV=test \
            -e SECRET_KEY="ci-$(openssl rand -hex 24)" \
            --env-file .github/app-ci/smoke.env \
            app:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 60); do
            if curl -fsS "http://127.0.0.1:${CI_APP_PORT}${CI_HEALTH_PATH}"; then echo; echo "Healthy after ~$((i * 5))s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app-ci)" != "true" ]; then echo "Container exited"; break; fi
            sleep 5
          done
          echo "Container did not become healthy"; docker logs app-ci; exit 1

      - name: Check the image serves pages and holds only runtime files
        run: |
          host_header=()
          if [ -n "$CI_HOME_HOST" ]; then host_header=(-H "Host: ${CI_HOME_HOST}"); fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "${host_header[@]}" "http://127.0.0.1:${CI_APP_PORT}/")"
          echo "Home page: HTTP ${code}"
          [ "$code" = "200" ] || { echo "Home page did not load"; exit 1; }
          docker exec \
            -e MUST_NOT_CONTAIN="$CI_IMAGE_MUST_NOT_CONTAIN" \
            -e MUST_CONTAIN="$CI_IMAGE_MUST_CONTAIN" \
            -e RUN_AS_UID="$CI_IMAGE_RUN_AS_UID" \
            app-ci sh -c '
            status=0
            for path in $MUST_NOT_CONTAIN; do
              case "$path" in /*) p="$path" ;; *) p="/app/$path" ;; esac
              if [ -e "$p" ]; then echo "Should not be in the image: $path"; status=1; fi
            done
            for path in $MUST_CONTAIN; do
              case "$path" in /*) p="$path" ;; *) p="/app/$path" ;; esac
              if [ ! -e "$p" ]; then echo "Missing from the image: $path"; status=1; fi
            done
            if command -v pip >/dev/null 2>&1; then echo "pip should not be in the image"; status=1; fi
            if [ -n "$RUN_AS_UID" ] && [ "$(id -u)" != "$RUN_AS_UID" ]; then
              echo "App should run as UID ${RUN_AS_UID}, not $(id -u)"; status=1
            fi
            exit $status
          '

      - name: Show container logs
        if: always()
        run: docker logs app-ci 2>&1 | tail -n 100 || true

      - name: Stop container
        if: always()
        run: docker rm -f app-ci || true

      # Scan for HIGH/CRITICAL vulnerabilities that have a fix available. The JSON report is turned
      # into a short list that includes where each package sits in the image, then the job fails.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy.json

      - name: Report Trivy findings
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]?
            | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)\t\(.PkgPath // $t)\t\((.Layer.CreatedBy // "") | .[0:80])"' \
            trivy.json | sort -u > findings.tsv
          if [ -s findings.tsv ]; then
            { echo "### Trivy: fixable HIGH/CRITICAL findings"; echo '```'; cat findings.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "Fixable HIGH/CRITICAL vulnerabilities (severity, id, package, location, Dockerfile step):"
            column -t -s "$(printf '\t')" findings.tsv
            exit 1
          fi
          echo "No fixable HIGH/CRITICAL vulnerabilities."
