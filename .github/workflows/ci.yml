name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  api-tests:
    name: API and Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements/dev.txt -c requirements/known-good-dev.txt

      - name: Guard against GPU dependency installs
        run: |
          python -c "import subprocess, sys; lines = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines(); names = [line.split('==', 1)[0].strip().lower() for line in lines if '==' in line]; blocked = sorted({name for name in names if name.startswith('nvidia-') or name.startswith('cuda-')});
          if blocked:
              print('Blocked GPU package(s) detected in pip environment:');
              [print(f'- {name}') for name in blocked];
              raise SystemExit(1)
          print('GPU dependency guard passed: no nvidia-* or cuda-* pip packages found.')"

      - name: Run non-UI pytest suite
        run: python -m pytest -m "not ui"

  ui-smoke:
    name: UI Smoke Tests
    runs-on: ubuntu-latest
    needs: api-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements/dev.txt -c requirements/known-good-dev.txt

      - name: Guard against GPU dependency installs
        run: |
          python -c "import subprocess, sys; lines = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines(); names = [line.split('==', 1)[0].strip().lower() for line in lines if '==' in line]; blocked = sorted({name for name in names if name.startswith('nvidia-') or name.startswith('cuda-')});
          if blocked:
              print('Blocked GPU package(s) detected in pip environment:');
              [print(f'- {name}') for name in blocked];
              raise SystemExit(1)
          print('GPU dependency guard passed: no nvidia-* or cuda-* pip packages found.')"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI pytest suite
        run: python -m pytest -m ui
