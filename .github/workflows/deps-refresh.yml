name: Dependency Refresh

# Weekly: refresh the Python lock files (scripts/update_python_dependencies.py, one run per
# profile in CI_LOCK_PROFILES) and the app's vendored front-end files (scripts/ci_refresh_frontend.sh,
# when the app has one), then open or update one PR that merges itself once CI passes
# (CI_DEPS_AUTO_MERGE: `required-checks` queues GitHub auto-merge, `after-ci` labels it for
# merge-after-ci.yml, `off` leaves it for a human). Settings: .github/app-ci/settings.env.
# Direct requirements are capped below their next major, so this only brings in patch/minor
# updates of those.
#
# Needs repository secret DEPS_AUTOMATION_TOKEN: a fine-grained personal access token for this
# repository with "Contents: Read and write" and "Pull requests: Read and write". A PR opened with
# the built-in GITHUB_TOKEN would not trigger CI, and its merge would not trigger later workflows.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check automation token is configured
        env:
          TOKEN: ${{ secrets.DEPS_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret DEPS_AUTOMATION_TOKEN is not set (see the comment at the top of this workflow)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load app settings
        run: grep -hEv '^[[:space:]]*(#|$)' .github/app-ci/settings.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      # Each profile is resolved in its own clean virtualenv because the script writes its lock
      # file from `pip freeze`. Tests are not run here; the PR's CI runs the full suite and the
      # image smoke test before anything can merge.
      - name: Refresh Python lock files
        run: |
          for profile in $CI_LOCK_PROFILES; do
            python -m venv "$RUNNER_TEMP/venv-$profile"
            "$RUNNER_TEMP/venv-$profile/bin/python" -m pip install --quiet --upgrade pip
            "$RUNNER_TEMP/venv-$profile/bin/python" scripts/update_python_dependencies.py --profile "$profile" --skip-tests
          done

      # Node comes from .nvmrc, so front-end files are built with the same Node as locally.
      - name: Set up Node
        if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # What "refresh" means is the app's own business: the script updates files, reports to the
      # job summary, or both.
      - name: Refresh vendored front-end files
        if: hashFiles('scripts/ci_refresh_frontend.sh') != ''
        run: sh scripts/ci_refresh_frontend.sh

      - name: Open or update the refresh PR
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.DEPS_AUTOMATION_TOKEN }}
          branch: deps/weekly-refresh
          delete-branch: true
          commit-message: "Weekly dependency refresh"
          title: "Weekly dependency refresh"
          # The merge-after-ci label tells merge-after-ci.yml it may merge this PR once CI passes.
          labels: ${{ env.CI_DEPS_AUTO_MERGE == 'after-ci' && 'dependencies,merge-after-ci' || 'dependencies' }}
          body: |
            Automated weekly refresh:
            - Python lock files regenerated with `scripts/update_python_dependencies.py` (profiles: ${{ env.CI_LOCK_PROFILES }}).
            - Vendored front-end files refreshed by `scripts/ci_refresh_frontend.sh` within their current major version; a new major version is only reported in the workflow run's summary.

            Merge: `CI_DEPS_AUTO_MERGE=${{ env.CI_DEPS_AUTO_MERGE }}`. With `required-checks` or
            `after-ci` this PR merges itself once CI passes; with `off`, merge it by hand. If a check
            fails it stays open for a human to look at.

      - name: Queue auto-merge
        if: steps.pr.outputs.pull-request-number != '' && env.CI_DEPS_AUTO_MERGE == 'required-checks'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.DEPS_AUTOMATION_TOKEN }}
