name: Embedding Runtime Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  embedding-tests:
    name: Embedding Runtime Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI_IMAGE_RECOGNITION in .github/app-ci/settings.env: apps without image recognition skip the rest.
      - name: Load app settings
        run: |
          grep -hEv '^[[:space:]]*(#|$)' .github/app-ci/settings.env .github/app-ci/test.env >> "$GITHUB_ENV"
          if ! grep -qx 'CI_IMAGE_RECOGNITION=true' .github/app-ci/settings.env; then
            echo "This app has no image recognition (CI_IMAGE_RECOGNITION); nothing to test." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: env.CI_IMAGE_RECOGNITION == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}

      - name: Install core test dependencies
        if: env.CI_IMAGE_RECOGNITION == 'true'
        run: python -m pip install --no-cache-dir -r "$CI_TEST_REQUIREMENTS" -c "$CI_TEST_LOCK"

      - name: Guard against GPU dependency installs
        if: env.CI_IMAGE_RECOGNITION == 'true'
        run: |
          python -c "import subprocess, sys; lines = subprocess.check_output([sys.executable, '-m', 'pip', 'freeze'], text=True).splitlines(); names = [line.split('==', 1)[0].strip().lower() for line in lines if '==' in line]; blocked = sorted({name for name in names if name.startswith('nvidia-') or name.startswith('cuda-')});
          if blocked:
              print('Blocked GPU package(s) detected in pip environment:');
              [print(f'- {name}') for name in blocked];
              raise SystemExit(1)
          print('GPU dependency guard passed: no nvidia-* or cuda-* pip packages found.')"

      - name: Run embedding pytest suite
        if: env.CI_IMAGE_RECOGNITION == 'true'
        run: python -m pytest -m embedding
