name: Build and Promote

# After CI passes on a push to master: build the image once, publish it as sha-<12>, point `test`
# at its digest (the NAS deploy agent then deploys it), and wait for approval to point `prod` at
# the same digest. Approving an older run is refused once a newer build has replaced `test`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

# No workflow-level concurrency: a run waiting days for prod approval must not block newer builds.
jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    concurrency:
      group: build-image
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image_name=ghcr.io/${OWNER_LOWER}/jigsaurium"
            echo "short_sha=${SHA::12}"
            echo "version=$(git describe --tags --always)"
            echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.image_name }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_BUILD_SHA=${{ github.event.workflow_run.head_sha }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Record digest
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image built"
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${IMAGE_NAME}:sha-${SHORT_SHA}\`"
            echo "- Digest: \`${IMAGE_NAME}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-test:
    name: Promote to test
    needs: build
    uses: ./.github/workflows/promote-pointer-tag.yml
    with:
      source_ref: ${{ needs.build.outputs.digest }}
      target_pointer: test

  promote-prod:
    name: Promote to prod (needs approval)
    needs: [build, promote-test]
    uses: ./.github/workflows/promote-pointer-tag.yml
    with:
      source_ref: ${{ needs.build.outputs.digest }}
      target_pointer: prod
      require_current_test: true
